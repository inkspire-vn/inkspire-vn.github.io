<!DOCTYPE html>
<html lang="vi" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev - InkSpire</title>

  <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/254457838?s=64">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">

  <!-- Firebase SDK -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
    // ──────────────────────────────────────────────
    // Firebase imports & initialization
    // ──────────────────────────────────────────────
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA9XvWCZOyaSuT42HBMUgQQ7KTuQYPWLbE",
      authDomain: "inkspire-vn-security.firebaseapp.com",
      databaseURL: "https://inkspire-vn-security-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "inkspire-vn-security",
      storageBucket: "inkspire-vn-security.firebasestorage.app",
      messagingSenderId: "774834040534",
      appId: "1:774834040534:web:c7b5e64826176a44b4e377",
      measurementId: "G-MJSRBE9TY6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // Force logout on every page load → no auto-login
    signOut(auth).catch(() => {});

    // ──────────────────────────────────────────────
    // Global variables
    // ──────────────────────────────────────────────
    let currentProducts = [];
    let currentEvents = [];

    const loginScreen = document.getElementById('login-screen');
    const devContent  = document.getElementById('dev-content');
    const googleSignIn = document.getElementById('googleSignIn');
    const signOutBtn   = document.getElementById('signOutBtn');
    const loginError   = document.getElementById('loginError');
    const searchInput  = document.getElementById('searchInput');

    // ──────────────────────────────────────────────
    // Auth state listener + email restriction
    // ──────────────────────────────────────────────
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // Only allow this exact email
        if (user.email !== 'inkspire.bookstore.vn@gmail.com') {
          alert('Chỉ tài khoản inkspire.bookstore.vn@gmail.com được phép truy cập.');
          signOut(auth);
          return;
        }

        loginScreen.classList.add('d-none');
        devContent.classList.remove('d-none');
        loadAllData();
      } else {
        loginScreen.classList.remove('d-none');
        devContent.classList.add('d-none');
      }
    });

    googleSignIn.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        loginError.classList.remove('d-none');
        console.error('Login error:', error);
      }
    });

    signOutBtn.addEventListener('click', async () => {
      await signOut(auth);
    });

    // ──────────────────────────────────────────────
    // Real-time data loading
    // ──────────────────────────────────────────────
    function loadAllData() {
      onValue(ref(db, 'products'), (snapshot) => {
        const data = snapshot.val() || {};
        currentProducts = Object.entries(data).map(([key, val]) => ({ key, ...val }));
        renderProducts(currentProducts);
      });

      onValue(ref(db, 'events'), (snapshot) => {
        const data = snapshot.val() || {};
        currentEvents = Object.entries(data).map(([key, val]) => ({ key, ...val }));
        renderEvents(currentEvents);
      });
    }

    // ──────────────────────────────────────────────
    // Render products with delete button
    // ──────────────────────────────────────────────
    function renderProducts(products) {
      const list = document.getElementById('productList');
      list.innerHTML = '';

      if (products.length === 0) {
        list.innerHTML = '<p class="text-muted text-center py-4">Chưa có sản phẩm nào.</p>';
        return;
      }

      products.forEach(p => {
        const item = document.createElement('div');
        item.className = 'list-group-item d-flex justify-content-between align-items-center';
        item.innerHTML = `
          <div>
            <strong>${p.name}</strong> — ${p.price} (${p.category})<br>
            <small class="text-muted">${p.image.substring(0, 60)}${p.image.length > 60 ? '...' : ''}</small>
          </div>
          <button class="btn btn-danger btn-sm" onclick="deleteProduct('${p.key}')">
            <i class="fas fa-trash"></i> Xóa
          </button>
        `;
        list.appendChild(item);
      });
    }

    window.deleteProduct = async (key) => {
      if (!confirm('Xóa sản phẩm này?')) return;
      await remove(ref(db, `products/${key}`));
    };

    // Add product
    document.getElementById('productForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('productName').value.trim();
      const price = document.getElementById('productPrice').value.trim();
      const category = document.getElementById('productCategory').value;
      const image = document.getElementById('productImage').value.trim();

      if (!name || !price || !category || !image) return alert('Điền đầy đủ thông tin!');

      await push(ref(db, 'products'), { name, price, category, image });
      e.target.reset();
    });

    // ──────────────────────────────────────────────
    // Render events with delete button
    // ──────────────────────────────────────────────
    function renderEvents(events) {
      const list = document.getElementById('eventList');
      list.innerHTML = '';

      if (events.length === 0) {
        list.innerHTML = '<p class="text-muted text-center py-4">Chưa có sự kiện nào.</p>';
        return;
      }

      events.forEach(e => {
        const item = document.createElement('div');
        item.className = 'list-group-item d-flex justify-content-between align-items-center';
        item.innerHTML = `
          <div>
            <strong>${e.title}</strong> — ${e.date}<br>
            <small class="text-muted">${e.desc.substring(0, 80)}${e.desc.length > 80 ? '...' : ''}</small>
          </div>
          <button class="btn btn-danger btn-sm" onclick="deleteEvent('${e.key}')">
            <i class="fas fa-trash"></i> Xóa
          </button>
        `;
        list.appendChild(item);
      });
    }

    window.deleteEvent = async (key) => {
      if (!confirm('Xóa sự kiện này?')) return;
      await remove(ref(db, `events/${key}`));
    };

    // Add event
    document.getElementById('eventForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('eventTitle').value.trim();
      const date = document.getElementById('eventDate').value.trim();
      const desc = document.getElementById('eventDesc').value.trim();
      const image = document.getElementById('eventImage').value.trim() || '';

      if (!title || !date || !desc) return alert('Điền đầy đủ thông tin bắt buộc!');

      await push(ref(db, 'events'), { title, date, desc, image });
      e.target.reset();
    });

    // ──────────────────────────────────────────────
    // Live search / filter
    // ──────────────────────────────────────────────
    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase().trim();

      const filteredProducts = currentProducts.filter(p =>
        p.name.toLowerCase().includes(term) || p.category.toLowerCase().includes(term)
      );
      renderProducts(filteredProducts);

      const filteredEvents = currentEvents.filter(e =>
        e.title.toLowerCase().includes(term) || e.desc.toLowerCase().includes(term)
      );
      renderEvents(filteredEvents);
    });

    // ──────────────────────────────────────────────
    // Theme toggle
    // ──────────────────────────────────────────────
    const html = document.documentElement;
    const themeBtn = document.getElementById('themeBtn');

    function setTheme(mode) {
      html.setAttribute('data-bs-theme', mode);
      localStorage.setItem('theme', mode);
      themeBtn.textContent = mode === 'dark' ? '☀️' : '🌙';
    }

    setTheme(localStorage.getItem('theme') || 'light');
    themeBtn.onclick = () => setTheme(html.getAttribute('data-bs-theme') === 'light' ? 'dark' : 'light');

    // ──────────────────────────────────────────────
    // Language toggle
    // ──────────────────────────────────────────────
    const langGroup = document.getElementById('langGroup');
    const langSwitch = document.getElementById('langSwitch');

    const dict = {
      vi: {
        home: "Trang chủ",
        products: "Sản phẩm",
        events: "Sự kiện",
        contact: "Liên hệ",
        footer: "Tri thức bắt đầu từ một giọt mực"
      },
      en: {
        home: "Home",
        products: "Products",
        events: "Events",
        contact: "Contact",
        footer: "Knowledge begins with a drop of ink"
      }
    };

    function setLang(lang) {
      html.lang = lang;
      localStorage.setItem('lang', lang);
      langSwitch.checked = (lang === 'en');

      document.querySelector('.vi-flag').classList.toggle('inactive', lang !== 'vi');
      document.querySelector('.en-flag').classList.toggle('inactive', lang !== 'en');

      document.querySelectorAll('[data-lang-key]').forEach(el => {
        const k = el.getAttribute('data-lang-key');
        if (dict[lang][k]) el.textContent = dict[lang][k];
      });
    }

    setLang(localStorage.getItem('lang') || 'vi');

    langGroup.addEventListener('click', () => {
      const cur = localStorage.getItem('lang') || 'vi';
      setLang(cur === 'vi' ? 'en' : 'vi');
    });

    langSwitch.addEventListener('change', () => {
      setLang(langSwitch.checked ? 'en' : 'vi');
    });
  </script>
</head>
<body>

<!-- Login screen (staff only) -->
<div id="login-screen" class="d-flex align-items-center justify-content-center vh-100 bg-light">
  <div class="card p-5 shadow-lg text-center" style="max-width: 420px;">
    <h3>Dev Access - Staff Only</h3>
    <p class="text-muted mb-4">Đăng nhập bằng Google để quản lý</p>
    <button id="googleSignIn" class="btn btn-outline-danger btn-lg w-100 mb-3">
      <i class="fab fa-google me-2"></i> Đăng nhập bằng Google
    </button>
    <p id="loginError" class="text-danger d-none">Đăng nhập thất bại hoặc không được phép.</p>
  </div>
</div>

<!-- Main dev content -->
<div id="dev-content" class="d-none">
  <nav class="navbar navbar-expand-lg sticky-top shadow">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="https://inkspire-vn.github.io">InkSpire</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="https://inkspire-vn.github.io">Trang chủ</a></li>
          <li class="nav-item"><a class="nav-link" href="/products">Sản phẩm</a></li>
          <li class="nav-item"><a class="nav-link" href="/events">Sự kiện</a></li>
          <li class="nav-item"><a class="nav-link" href="/contact">Liên hệ</a></li>
        </ul>

        <div class="d-flex align-items-center gap-4">
          <div class="lang-group" id="langGroup" role="button" tabindex="0">
            <span class="flag vi-flag" data-lang="vi">🇻🇳</span>
            <div class="switch">
              <input type="checkbox" id="langSwitch">
              <span class="slider"></span>
            </div>
            <span class="flag en-flag" data-lang="en">🇺🇸</span>
          </div>
          <button class="theme-btn" id="themeBtn">🌙</button>
          <button id="signOutBtn" class="btn btn-sm btn-outline-danger">Đăng xuất</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <h1 class="text-center mb-5">Dev Page - Quản lý Sản phẩm & Sự kiện</h1>

    <!-- Search box for filtering -->
    <div class="mb-4">
      <input type="text" id="searchInput" class="form-control" placeholder="Tìm theo tên hoặc danh mục...">
    </div>

    <!-- Tabs -->
    <ul class="nav nav-tabs mb-4" id="devTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="products-tab" data-bs-toggle="tab" data-bs-target="#products" type="button" role="tab">Sản phẩm</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="events-tab" data-bs-toggle="tab" data-bs-target="#events" type="button" role="tab">Sự kiện</button>
      </li>
    </ul>

    <div class="tab-content" id="devTabContent">
      <div class="tab-pane fade show active" id="products" role="tabpanel">
        <h3 class="mb-4">Thêm sản phẩm mới</h3>
        <form id="productForm" class="row g-3 mb-5">
          <div class="col-md-6">
            <label class="form-label">Tên sản phẩm</label>
            <input type="text" class="form-control" id="productName" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Giá (ví dụ: 220k)</label>
            <input type="text" class="form-control" id="productPrice" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Danh mục</label>
            <select class="form-select" id="productCategory" required>
              <option value="Books">Sách – Books</option>
              <option value="Stationery">Văn phòng phẩm – Stationery</option>
              <option value="Toys">Đồ chơi – Toys</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label">Link ảnh (URL)</label>
            <input type="url" class="form-control" id="productImage" required>
          </div>
          <div class="col-12 text-end">
            <button type="submit" class="btn btn-primary">Thêm sản phẩm</button>
          </div>
        </form>

        <h4 class="mt-5 mb-3">Sản phẩm hiện tại</h4>
        <div id="productList" class="list-group"></div>
      </div>

      <div class="tab-pane fade" id="events" role="tabpanel">
        <h3 class="mb-4">Thêm sự kiện mới</h3>
        <form id="eventForm" class="row g-3 mb-5">
          <div class="col-md-6">
            <label class="form-label">Tiêu đề sự kiện</label>
            <input type="text" class="form-control" id="eventTitle" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Ngày & giờ</label>
            <input type="text" class="form-control" id="eventDate" required>
          </div>
          <div class="col-12">
            <label class="form-label">Mô tả</label>
            <textarea class="form-control" id="eventDesc" rows="3" required></textarea>
          </div>
          <div class="col-12">
            <label class="form-label">Link ảnh (URL) – optional</label>
            <input type="url" class="form-control" id="eventImage">
          </div>
          <div class="col-12 text-end">
            <button type="submit" class="btn btn-primary">Thêm sự kiện</button>
          </div>
        </form>

        <h4 class="mt-5 mb-3">Sự kiện hiện tại</h4>
        <div id="eventList" class="list-group"></div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
  // Firebase initialized in head

  let currentProducts = [];
  let currentEvents = [];

  const loginScreen = document.getElementById('login-screen');
  const devContent = document.getElementById('dev-content');
  const googleSignIn = document.getElementById('googleSignIn');
  const signOutBtn = document.getElementById('signOutBtn');
  const loginError = document.getElementById('loginError');

  // Auth state
  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginScreen.classList.add('d-none');
      devContent.classList.remove('d-none');
      loadAllData();
    } else {
      loginScreen.classList.remove('d-none');
      devContent.classList.add('d-none');
    }
  });

  googleSignIn.addEventListener('click', async () => {
    try {
      await signInWithPopup(auth, provider);
    } catch (error) {
      loginError.classList.remove('d-none');
      console.error('Login error:', error);
    }
  });

  signOutBtn.addEventListener('click', async () => {
    await signOut(auth);
  });

  // Load real-time data
  function loadAllData() {
    onValue(ref(db, 'products'), (snapshot) => {
      const data = snapshot.val() || {};
      currentProducts = Object.entries(data).map(([key, val]) => ({ key, ...val }));
      renderProducts(currentProducts);
    });

    onValue(ref(db, 'events'), (snapshot) => {
      const data = snapshot.val() || {};
      currentEvents = Object.entries(data).map(([key, val]) => ({ key, ...val }));
      renderEvents(currentEvents);
    });
  }

  // Render products with delete
  function renderProducts(products) {
    const list = document.getElementById('productList');
    list.innerHTML = '';

    if (products.length === 0) {
      list.innerHTML = '<p class="text-muted text-center py-4">Chưa có sản phẩm nào.</p>';
      return;
    }

    products.forEach(p => {
      const item = document.createElement('div');
      item.className = 'list-group-item d-flex justify-content-between align-items-center';
      item.innerHTML = `
        <div>
          <strong>${p.name}</strong> — ${p.price} (${p.category})<br>
          <small class="text-muted">${p.image.substring(0, 60)}${p.image.length > 60 ? '...' : ''}</small>
        </div>
        <button class="btn btn-danger btn-sm" onclick="deleteProduct('${p.key}')">
          <i class="fas fa-trash"></i> Xóa
        </button>
      `;
      list.appendChild(item);
    });
  }

  window.deleteProduct = async (key) => {
    if (!confirm('Xóa sản phẩm này?')) return;
    await remove(ref(db, `products/${key}`));
  };

  // Add product
  document.getElementById('productForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('productName').value.trim();
    const price = document.getElementById('productPrice').value.trim();
    const category = document.getElementById('productCategory').value;
    const image = document.getElementById('productImage').value.trim();

    if (!name || !price || !category || !image) return alert('Điền đầy đủ!');

    await push(ref(db, 'products'), { name, price, category, image });
    e.target.reset();
  });

  // Render events with delete
  function renderEvents(events) {
    const list = document.getElementById('eventList');
    list.innerHTML = '';

    if (events.length === 0) {
      list.innerHTML = '<p class="text-muted text-center py-4">Chưa có sự kiện nào.</p>';
      return;
    }

    events.forEach(e => {
      const item = document.createElement('div');
      item.className = 'list-group-item d-flex justify-content-between align-items-center';
      item.innerHTML = `
        <div>
          <strong>${e.title}</strong> — ${e.date}<br>
          <small class="text-muted">${e.desc.substring(0, 80)}${e.desc.length > 80 ? '...' : ''}</small>
        </div>
        <button class="btn btn-danger btn-sm" onclick="deleteEvent('${e.key}')">
          <i class="fas fa-trash"></i> Xóa
        </button>
      `;
      list.appendChild(item);
    });
  }

  window.deleteEvent = async (key) => {
    if (!confirm('Xóa sự kiện này?')) return;
    await remove(ref(db, `events/${key}`));
  };

  // Add event
  document.getElementById('eventForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = document.getElementById('eventTitle').value.trim();
    const date = document.getElementById('eventDate').value.trim();
    const desc = document.getElementById('eventDesc').value.trim();
    const image = document.getElementById('eventImage').value.trim() || '';

    if (!title || !date || !desc) return alert('Điền đầy đủ!');

    await push(ref(db, 'events'), { title, date, desc, image });
    e.target.reset();
  });

  // Search filter (real-time)
  document.getElementById('searchInput').addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase().trim();

    // Filter products
    const filteredProducts = currentProducts.filter(p =>
      p.name.toLowerCase().includes(term) || p.category.toLowerCase().includes(term)
    );
    renderProducts(filteredProducts);

    // Filter events
    const filteredEvents = currentEvents.filter(e =>
      e.title.toLowerCase().includes(term) || e.desc.toLowerCase().includes(term)
    );
    renderEvents(filteredEvents);
  });

  // Theme toggle
  const html = document.documentElement;
  const themeBtn = document.getElementById('themeBtn');
  function setTheme(mode) {
    html.setAttribute('data-bs-theme', mode);
    localStorage.setItem('theme', mode);
    themeBtn.textContent = mode === 'dark' ? '☀️' : '🌙';
  }
  setTheme(localStorage.getItem('theme') || 'light');
  themeBtn.onclick = () => setTheme(html.getAttribute('data-bs-theme') === 'light' ? 'dark' : 'light');

  // Language toggle
  const langGroup = document.getElementById('langGroup');
  const langSwitch = document.getElementById('langSwitch');

  const dict = {
    vi: {
      home: "Trang chủ",
      products: "Sản phẩm",
      events: "Sự kiện",
      contact: "Liên hệ",
      "products-title": "Sản phẩm",
      "loading": "Đang tải...",
      "no-products": "Hiện chưa có sản phẩm nào",
      "no-products-desc": "Chúng tôi đang cập nhật danh mục sản phẩm. Vui lòng quay lại sau hoặc liên hệ trực tiếp!",
      "contact-now": "Liên hệ ngay",
      "back-home": "← Quay về Trang chủ",
      footer: "Tri thức bắt đầu từ một giọt mực"
    },
    en: {
      home: "Home",
      products: "Products",
      events: "Events",
      contact: "Contact",
      "products-title": "Products",
      "loading": "Loading...",
      "no-products": "No products available yet",
      "no-products-desc": "We are updating our product catalog. Please check back later or contact us!",
      "contact-now": "Contact Now",
      "back-home": "← Back to Home",
      footer: "Knowledge begins with a drop of ink"
    }
  };

  function setLang(lang) {
    html.lang = lang;
    localStorage.setItem('lang', lang);
    langSwitch.checked = (lang === 'en');

    document.querySelector('.vi-flag').classList.toggle('inactive', lang !== 'vi');
    document.querySelector('.en-flag').classList.toggle('inactive', lang !== 'en');

    document.querySelectorAll('[data-lang-key]').forEach(el => {
      const k = el.getAttribute('data-lang-key');
      if (dict[lang][k]) el.textContent = dict[lang][k];
    });
  }

  setLang(localStorage.getItem('lang') || 'vi');

  langGroup.addEventListener('click', () => {
    const cur = localStorage.getItem('lang') || 'vi';
    setLang(cur === 'vi' ? 'en' : 'vi');
  });

  langSwitch.addEventListener('change', () => {
    setLang(langSwitch.checked ? 'en' : 'vi');
  });
</script>
</body>
</html>
