<!DOCTYPE html>
<html lang="vi" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev - InkSpire</title>

  <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/254457838?s=64">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Flatpickr CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="/styles.css">

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA9XvWCZOyaSuT42HBMUgQQ7KTuQYPWLbE",
      authDomain: "inkspire-vn-security.firebaseapp.com",
      databaseURL: "https://inkspire-vn-security-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "inkspire-vn-security",
      storageBucket: "inkspire-vn-security.firebasestorage.app",
      messagingSenderId: "774834040534",
      appId: "1:774834040534:web:c7b5e64826176a44b4e377",
      measurementId: "G-MJSRBE9TY6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    window.db = db;
    window.auth = auth;
    window.provider = provider;
    window.signInWithPopup = signInWithPopup;
    window.onAuthStateChanged = onAuthStateChanged;
    window.signOut = signOut;
    window.ref = ref;
    window.onValue = onValue;
    window.push = push;
    window.remove = remove;
    window.update = update;

    signOut(auth).catch(() => {});
  </script>
</head>
<body>

<!-- Login screen -->
<div id="login-screen" class="d-flex align-items-center justify-content-center vh-100 bg-light">
  <div class="card p-5 shadow-lg text-center" style="max-width: 420px;">
    <h3>Dev Access - Staff Only</h3>
    <p class="text-muted mb-4">Đăng nhập bằng Google để quản lý</p>
    <button id="googleSignIn" class="btn btn-outline-danger btn-lg w-100 mb-3">
      <i class="fab fa-google me-2"></i> Đăng nhập bằng Google
    </button>
    <p id="loginError" class="text-danger d-none">Đăng nhập thất bại hoặc không được phép.</p>
  </div>
</div>

<!-- Main content -->
<div id="dev-content" class="d-none">
  <nav class="navbar navbar-expand-lg sticky-top shadow">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="https://inkspire-vn.github.io">InkSpire</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="https://inkspire-vn.github.io">Trang chủ</a></li>
          <li class="nav-item"><a class="nav-link" href="/products">Sản phẩm</a></li>
          <li class="nav-item"><a class="nav-link" href="/events">Sự kiện</a></li>
          <li class="nav-item"><a class="nav-link" href="/contact">Liên hệ</a></li>
        </ul>

        <div class="d-flex align-items-center gap-4">
          <div class="lang-group" id="langGroup" role="button" tabindex="0">
            <span class="flag vi-flag" data-lang="vi">🇻🇳</span>
            <div class="switch">
              <input type="checkbox" id="langSwitch">
              <span class="slider"></span>
            </div>
            <span class="flag en-flag" data-lang="en">🇺🇸</span>
          </div>
          <button class="theme-btn" id="themeBtn">🌙</button>
          <button id="signOutBtn" class="btn btn-sm btn-outline-danger">Đăng xuất</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <h1 class="text-center mb-5">Dev - Quản lý Sản phẩm & Sự kiện</h1>

    <div class="mb-4">
      <input type="text" id="searchInput" class="form-control" placeholder="Tìm theo tên hoặc danh mục...">
    </div>

    <ul class="nav nav-tabs mb-4" id="devTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="products-tab" data-bs-toggle="tab" data-bs-target="#products" type="button" role="tab">Sản phẩm</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="events-tab" data-bs-toggle="tab" data-bs-target="#events" type="button" role="tab">Sự kiện</button>
      </li>
    </ul>

    <div class="tab-content" id="devTabContent">
      <!-- Products tab -->
      <div class="tab-pane fade show active" id="products" role="tabpanel">
        <h3 class="mb-4">Thêm / Sửa sản phẩm</h3>
        <form id="productForm" class="row g-3 mb-5">
          <div class="col-md-6">
            <label class="form-label">Tên sản phẩm</label>
            <input type="text" class="form-control" id="productName" placeholder="Ví dụ: Sách Harry Potter" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Giá</label>
            <input type="text" class="form-control" id="productPrice" placeholder="Ví dụ: 220k" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Danh mục</label>
            <select class="form-select" id="productCategory" required>
              <option value="Books">Sách – Books</option>
              <option value="Stationery">Văn phòng phẩm – Stationery</option>
              <option value="Toys">Đồ chơi – Toys</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label">Link ảnh (URL)</label>
            <input type="url" class="form-control" id="productImage" placeholder="https://example.com/hinh-anh.jpg" required>
          </div>
          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="productOutOfStock">
              <label class="form-check-label" for="productOutOfStock">
                Hết hàng (Out of Stock)
              </label>
            </div>
          </div>
          <div class="col-12 text-end">
            <button type="submit" class="btn btn-primary" id="productSubmitBtn">Thêm sản phẩm</button>
          </div>
        </form>

        <h4 class="mt-5 mb-3">Sản phẩm hiện tại</h4>
        <div id="productList" class="list-group"></div>
      </div>

      <!-- Events tab with Flatpickr -->
      <div class="tab-pane fade" id="events" role="tabpanel">
        <h3 class="mb-4">Thêm / Sửa sự kiện</h3>
        <form id="eventForm" class="row g-3 mb-5">
          <div class="col-12">
            <label class="form-label">Tiêu đề sự kiện</label>
            <input type="text" class="form-control" id="eventTitle" placeholder="Ví dụ: Storytime for Kids" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Bắt đầu</label>
            <input type="text" class="form-control" id="eventStart" placeholder="Chọn ngày & giờ bắt đầu" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Kết thúc</label>
            <input type="text" class="form-control" id="eventEnd" placeholder="Chọn ngày & giờ kết thúc" required>
          </div>
          <div class="col-12">
            <label class="form-label">Mô tả</label>
            <textarea class="form-control" id="eventDesc" rows="3" placeholder="Ví dụ: Buổi kể chuyện vui nhộn cho trẻ em..." required></textarea>
          </div>
          <div class="col-12">
            <label class="form-label">Link ảnh (URL) – optional</label>
            <input type="url" class="form-control" id="eventImage" placeholder="https://example.com/su-kien.jpg">
          </div>
          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="eventAborted">
              <label class="form-check-label" for="eventAborted">Aborted (Bị hủy)</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="eventDelayed">
              <label class="form-check-label" for="eventDelayed">Delayed (Bị hoãn)</label>
            </div>
          </div>
          <div class="col-12 text-end">
            <button type="submit" class="btn btn-primary" id="eventSubmitBtn">Thêm sự kiện</button>
          </div>
        </form>

        <h4 class="mt-5 mb-3">Sự kiện hiện tại</h4>
        <div id="eventList" class="list-group"></div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Flatpickr JS -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr@4.6.13/dist/l10n/vi.js"></script>

<script type="module">
  const html = document.documentElement;

  let currentProducts = [];
  let currentEvents = [];
  let editingProductKey = null;
  let editingEventKey = null;

  const loginScreen = document.getElementById('login-screen');
  const devContent = document.getElementById('dev-content');
  const googleSignIn = document.getElementById('googleSignIn');
  const signOutBtn = document.getElementById('signOutBtn');
  const loginError = document.getElementById('loginError');
  const searchInput = document.getElementById('searchInput');

  // Auth
  onAuthStateChanged(auth, (user) => {
    if (user) {
      if (user.email !== 'inkspire.bookstore.vn@gmail.com') {
        alert('Chỉ tài khoản inkspire.bookstore.vn@gmail.com được phép truy cập.');
        signOut(auth);
        return;
      }
      loginScreen.classList.add('d-none');
      devContent.classList.remove('d-none');
      loadAllData();
    } else {
      loginScreen.classList.remove('d-none');
      devContent.classList.add('d-none');
      resetProductForm();
      resetEventForm();
    }
  });

  googleSignIn.addEventListener('click', async () => {
    try {
      await signInWithPopup(auth, provider);
    } catch (error) {
      loginError.classList.remove('d-none');
      console.error('Login error:', error);
    }
  });

  signOutBtn.addEventListener('click', () => signOut(auth));

  function loadAllData() {
    onValue(ref(db, 'products'), (snapshot) => {
      currentProducts = Object.entries(snapshot.val() || {}).map(([key, val]) => ({ key, ...val }));
      renderProducts(currentProducts);
    });

    onValue(ref(db, 'events'), (snapshot) => {
      currentEvents = Object.entries(snapshot.val() || {}).map(([key, val]) => ({ key, ...val }));
      renderEvents(currentEvents);
    });
  }

  // Flatpickr setup (Vietnamese locale, 24hr format)
  flatpickr("#eventStart", {
    enableTime: true,
    dateFormat: "d/m/Y H:i",
    time_24hr: true,
    defaultHour: 10,
    defaultMinute: 0,
    minuteIncrement: 15,
    locale: "vi",
    weekStart: 1 // Monday
  });

  flatpickr("#eventEnd", {
    enableTime: true,
    dateFormat: "d/m/Y H:i",
    time_24hr: true,
    defaultHour: 12,
    defaultMinute: 0,
    minuteIncrement: 15,
    locale: "vi",
    weekStart: 1
  });

  // Products render
  function renderProducts(products) {
    const list = document.getElementById('productList');
    list.innerHTML = products.map(p => `
      <div class="list-group-item d-flex justify-content-between align-items-center">
        <div>
          <strong>${p.name}</strong> — ${p.price} (${p.category})<br>
          <small class="text-muted">${p.image.substring(0,60)}${p.image.length > 60 ? '...' : ''}</small>
          ${p.outOfStock ? '<span class="badge bg-danger ms-2">Hết hàng</span>' : ''}
        </div>
        <div>
          <button class="btn btn-warning btn-sm me-2" onclick="editProduct('${p.key}')">Sửa</button>
          <button class="btn btn-danger btn-sm" onclick="deleteProduct('${p.key}')">Xóa</button>
        </div>
      </div>
    `).join('');
  }

  window.editProduct = (key) => {
    const p = currentProducts.find(x => x.key === key);
    if (!p) return;

    editingProductKey = key;
    document.getElementById('productName').value = p.name || '';
    document.getElementById('productPrice').value = p.price || '';
    document.getElementById('productCategory').value = p.category || 'Books';
    document.getElementById('productImage').value = p.image || '';
    document.getElementById('productOutOfStock').checked = !!p.outOfStock;
    document.getElementById('productSubmitBtn').textContent = 'Cập nhật sản phẩm';
  };

  window.deleteProduct = async (key) => {
    if (!confirm('Xóa sản phẩm này?')) return;
    await remove(ref(db, `products/${key}`));
  };

  document.getElementById('productForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('productName').value.trim();
    const price = document.getElementById('productPrice').value.trim();
    const category = document.getElementById('productCategory').value;
    const image = document.getElementById('productImage').value.trim();
    const outOfStock = document.getElementById('productOutOfStock').checked;

    if (!name || !price || !category || !image) return alert('Điền đầy đủ!');

    const data = { name, price, category, image, outOfStock };

    if (editingProductKey) {
      await update(ref(db, `products/${editingProductKey}`), data);
      alert('Đã cập nhật sản phẩm!');
      editingProductKey = null;
      document.getElementById('productSubmitBtn').textContent = 'Thêm sản phẩm';
    } else {
      await push(ref(db, 'products'), data);
      alert('Đã thêm sản phẩm!');
    }

    e.target.reset();
    document.getElementById('productOutOfStock').checked = false;
  });

  function resetProductForm() {
    document.getElementById('productForm').reset();
    document.getElementById('productSubmitBtn').textContent = 'Thêm sản phẩm';
    document.getElementById('productOutOfStock').checked = false;
    editingProductKey = null;
  }

  // Events render with status
  function renderEvents(events) {
    const list = document.getElementById('eventList');
    const now = new Date();

    list.innerHTML = events.map(e => {
      const start = new Date(e.start);
      const end = new Date(e.end);
      let status = '';

      if (e.aborted) status = '<span class="badge bg-secondary">Bị hủy</span>';
      else if (e.delayed) status = '<span class="badge bg-warning">Bị hoãn</span>';
      else if (now < start) status = '<span class="badge bg-info">Sắp diễn ra</span>';
      else if (now > end) status = '<span class="badge bg-danger">Đã kết thúc</span>';
      else status = '<span class="badge bg-success">Đang diễn ra</span>';

      return `
        <div class="list-group-item d-flex justify-content-between align-items-center">
          <div>
            <strong>${e.title}</strong><br>
            <small>${e.start} → ${e.end}</small><br>
            <small>${e.desc.substring(0, 80)}${e.desc.length > 80 ? '...' : ''}</small><br>
            ${status}
          </div>
          <div>
            <button class="btn btn-warning btn-sm me-2" onclick="editEvent('${e.key}')">Sửa</button>
            <button class="btn btn-danger btn-sm" onclick="deleteEvent('${e.key}')">Xóa</button>
          </div>
        </div>
      `;
    }).join('');
  }

  window.editEvent = (key) => {
    const e = currentEvents.find(x => x.key === key);
    if (!e) return;

    editingEventKey = key;
    document.getElementById('eventTitle').value = e.title || '';
    document.getElementById('eventStart').value = e.start || '';
    document.getElementById('eventEnd').value = e.end || '';
    document.getElementById('eventDesc').value = e.desc || '';
    document.getElementById('eventImage').value = e.image || '';
    document.getElementById('eventAborted').checked = !!e.aborted;
    document.getElementById('eventDelayed').checked = !!e.delayed;
    document.getElementById('eventSubmitBtn').textContent = 'Cập nhật sự kiện';
  };

  window.deleteEvent = async (key) => {
    if (!confirm('Xóa sự kiện này?')) return;
    await remove(ref(db, `events/${key}`));
  };

  document.getElementById('eventForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = document.getElementById('eventTitle').value.trim();
    const start = document.getElementById('eventStart').value.trim();
    const end = document.getElementById('eventEnd').value.trim();
    const desc = document.getElementById('eventDesc').value.trim();
    const image = document.getElementById('eventImage').value.trim() || '';
    const aborted = document.getElementById('eventAborted').checked;
    const delayed = document.getElementById('eventDelayed').checked;

    if (!title || !start || !end || !desc) {
      alert('Vui lòng điền đầy đủ!');
      return;
    }

    const data = { title, start, end, desc, image, aborted, delayed };

    if (editingEventKey) {
      await update(ref(db, `events/${editingEventKey}`), data);
      alert('Đã cập nhật sự kiện!');
      editingEventKey = null;
      document.getElementById('eventSubmitBtn').textContent = 'Thêm sự kiện';
    } else {
      await push(ref(db, 'events'), data);
      alert('Đã thêm sự kiện!');
    }

    e.target.reset();
    document.getElementById('eventAborted').checked = false;
    document.getElementById('eventDelayed').checked = false;
  });

  function resetEventForm() {
    document.getElementById('eventForm').reset();
    document.getElementById('eventSubmitBtn').textContent = 'Thêm sự kiện';
    document.getElementById('eventAborted').checked = false;
    document.getElementById('eventDelayed').checked = false;
    editingEventKey = null;
  }

  // Search
  searchInput.addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase().trim();
    renderProducts(currentProducts.filter(p => 
      p.name.toLowerCase().includes(term) || p.category.toLowerCase().includes(term)
    ));
    renderEvents(currentEvents.filter(e => 
      e.title.toLowerCase().includes(term) || e.desc.toLowerCase().includes(term)
    ));
  });

  // Theme & Language
  const themeBtn = document.getElementById('themeBtn');
  function setTheme(mode) {
    html.setAttribute('data-bs-theme', mode);
    localStorage.setItem('theme', mode);
    themeBtn.textContent = mode === 'dark' ? '☀️' : '🌙';
  }
  setTheme(localStorage.getItem('theme') || 'light');
  themeBtn.onclick = () => setTheme(html.getAttribute('data-bs-theme') === 'light' ? 'dark' : 'light');

  const langGroup = document.getElementById('langGroup');
  const langSwitch = document.getElementById('langSwitch');

  function setLang(lang) {
    html.lang = lang;
    localStorage.setItem('lang', lang);
    langSwitch.checked = (lang === 'en');
    document.querySelector('.vi-flag').classList.toggle('inactive', lang !== 'vi');
    document.querySelector('.en-flag').classList.toggle('inactive', lang !== 'en');
  }

  setLang(localStorage.getItem('lang') || 'vi');

  langGroup.addEventListener('click', () => {
    const cur = localStorage.getItem('lang') || 'vi';
    setLang(cur === 'vi' ? 'en' : 'vi');
  });

  langSwitch.addEventListener('change', () => {
    setLang(langSwitch.checked ? 'en' : 'vi');
  });
</script>
</body>
</html>
