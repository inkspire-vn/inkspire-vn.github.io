<!DOCTYPE html>
<html lang="vi" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev - InkSpire</title>

  <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/254457838?s=64">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA9XvWCZOyaSuT42HBMUgQQ7KTuQYPWLbE",
      authDomain: "inkspire-vn-security.firebaseapp.com",
      databaseURL: "https://inkspire-vn-security-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "inkspire-vn-security",
      storageBucket: "inkspire-vn-security.firebasestorage.app",
      messagingSenderId: "774834040534",
      appId: "1:774834040534:web:c7b5e64826176a44b4e377",
      measurementId: "G-MJSRBE9TY6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    window.db = db;
    window.auth = auth;
    window.provider = provider;
    window.signInWithPopup = signInWithPopup;
    window.onAuthStateChanged = onAuthStateChanged;
    window.signOut = signOut;
    window.ref = ref;
    window.onValue = onValue;
    window.push = push;
    window.remove = remove;
    window.update = update;

    signOut(auth).catch(() => {});
  </script>
</head>
<body>

<!-- Login screen -->
<div id="login-screen" class="d-flex align-items-center justify-content-center vh-100 bg-light">
  <div class="card p-5 shadow-lg text-center" style="max-width: 420px;">
    <h3>Dev Access - Staff Only</h3>
    <p class="text-muted mb-4">Đăng nhập bằng Google để quản lý</p>
    <button id="googleSignIn" class="btn btn-outline-danger btn-lg w-100 mb-3">
      <i class="fab fa-google me-2"></i> Đăng nhập bằng Google
    </button>
    <p id="loginError" class="text-danger d-none">Đăng nhập thất bại hoặc không được phép.</p>
  </div>
</div>

<!-- Main content -->
<div id="dev-content" class="d-none">
  <nav class="navbar navbar-expand-lg sticky-top shadow bg-primary navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="https://inkspire-vn.github.io">InkSpire</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="https://inkspire-vn.github.io">Trang chủ</a></li>
          <li class="nav-item"><a class="nav-link" href="/products">Sản phẩm</a></li>
          <li class="nav-item"><a class="nav-link" href="/events">Sự kiện</a></li>
          <li class="nav-item"><a class="nav-link" href="/contact">Liên hệ</a></li>
        </ul>

        <div class="d-flex align-items-center gap-4">
          <div class="lang-group" id="langGroup" role="button" tabindex="0">
            <span class="flag vi-flag" data-lang="vi">🇻🇳</span>
            <div class="switch">
              <input type="checkbox" id="langSwitch">
              <span class="slider"></span>
            </div>
            <span class="flag en-flag" data-lang="en">🇺🇸</span>
          </div>
          <button class="theme-btn btn btn-sm btn-outline-light" id="themeBtn">🌙</button>
          <button id="signOutBtn" class="btn btn-sm btn-outline-light">Đăng xuất</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <h1 class="text-center mb-5">Dev - Quản lý Sản phẩm & Sự kiện</h1>

    <div class="mb-4">
      <input type="text" id="searchInput" class="form-control" placeholder="Tìm theo tên...">
    </div>

    <ul class="nav nav-tabs mb-4" id="devTabs" role="tablist">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#products">Sản phẩm</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#events">Sự kiện</button></li>
    </ul>

    <div class="tab-content">
      <!-- Products tab (kept simple) -->
      <div class="tab-pane fade show active" id="products">
        <h3>Thêm / Sửa sản phẩm</h3>
        <form id="productForm" class="row g-3 mb-5">
          <div class="col-md-6"><input type="text" class="form-control" id="productName" placeholder="Tên sản phẩm" required></div>
          <div class="col-md-3"><input type="text" class="form-control" id="productPrice" placeholder="Giá" required></div>
          <div class="col-md-3">
            <select class="form-select" id="productCategory" required>
              <option value="Books">Sách – Books</option>
              <option value="Stationery">Văn phòng phẩm</option>
              <option value="Toys">Đồ chơi</option>
            </select>
          </div>
          <div class="col-12"><input type="url" class="form-control" id="productImage" placeholder="Link ảnh" required></div>
          <div class="col-12">
            <label><input type="checkbox" id="productOutOfStock"> Hết hàng</label>
          </div>
          <button type="submit" class="btn btn-primary" id="productSubmitBtn">Thêm sản phẩm</button>
        </form>

        <h4>Sản phẩm hiện tại</h4>
        <div id="productList" class="list-group"></div>
      </div>

      <!-- Events tab - with start, end, aborted, delayed -->
      <div class="tab-pane fade" id="events">
        <h3>Thêm / Sửa sự kiện</h3>
        <form id="eventForm" class="row g-3 mb-5">
          <div class="col-12"><input type="text" class="form-control" id="eventTitle" placeholder="Tiêu đề sự kiện" required></div>
          <div class="col-md-6"><input type="text" class="form-control" id="eventStart" placeholder="Bắt đầu (20/01/2026 10:00)" required></div>
          <div class="col-md-6"><input type="text" class="form-control" id="eventEnd" placeholder="Kết thúc (20/01/2026 12:00)" required></div>
          <div class="col-12"><textarea class="form-control" id="eventDesc" rows="3" placeholder="Mô tả" required></textarea></div>
          <div class="col-12"><input type="url" class="form-control" id="eventImage" placeholder="Link ảnh (tùy chọn)"></div>
          <div class="col-12">
            <label><input type="checkbox" id="eventAborted"> Aborted (Bị hủy)</label><br>
            <label><input type="checkbox" id="eventDelayed"> Delayed (Bị hoãn)</label>
          </div>
          <button type="submit" class="btn btn-primary" id="eventSubmitBtn">Thêm sự kiện</button>
        </form>

        <h4>Sự kiện hiện tại</h4>
        <div id="eventList" class="list-group"></div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
  const html = document.documentElement;
  let currentProducts = [];
  let currentEvents = [];
  let editingProductKey = null;
  let editingEventKey = null;

  const loginScreen = document.getElementById('login-screen');
  const devContent = document.getElementById('dev-content');
  const googleSignIn = document.getElementById('googleSignIn');
  const signOutBtn = document.getElementById('signOutBtn');
  const loginError = document.getElementById('loginError');

  onAuthStateChanged(auth, (user) => {
    if (user) {
      if (user.email !== 'inkspire.bookstore.vn@gmail.com') {
        alert('Chỉ tài khoản inkspire.bookstore.vn@gmail.com được phép truy cập.');
        signOut(auth);
        return;
      }
      loginScreen.classList.add('d-none');
      devContent.classList.remove('d-none');
      loadAllData();
    } else {
      loginScreen.classList.remove('d-none');
      devContent.classList.add('d-none');
    }
  });

  googleSignIn.addEventListener('click', async () => {
    try {
      await signInWithPopup(auth, provider);
    } catch (error) {
      loginError.classList.remove('d-none');
    }
  });

  signOutBtn.addEventListener('click', () => signOut(auth));

  function loadAllData() {
    onValue(ref(db, 'products'), (snapshot) => {
      currentProducts = Object.entries(snapshot.val() || {}).map(([k,v]) => ({key:k, ...v}));
      renderProducts();
    });
    onValue(ref(db, 'events'), (snapshot) => {
      currentEvents = Object.entries(snapshot.val() || {}).map(([k,v]) => ({key:k, ...v}));
      renderEvents();
    });
  }

  // Products render (with out of stock)
  function renderProducts() {
    const list = document.getElementById('productList');
    list.innerHTML = currentProducts.map(p => `
      <div class="list-group-item d-flex justify-content-between align-items-center">
        <div>
          <strong>${p.name}</strong> — ${p.price} (${p.category})<br>
          <small class="text-muted">${p.image.substring(0,60)}...</small>
          ${p.outOfStock ? '<span class="badge bg-danger ms-2">Hết hàng</span>' : ''}
        </div>
        <div>
          <button class="btn btn-warning btn-sm me-2" onclick="editProduct('${p.key}')">Sửa</button>
          <button class="btn btn-danger btn-sm" onclick="deleteProduct('${p.key}')">Xóa</button>
        </div>
      </div>
    `).join('');
  }

  // Events render with auto status + aborted/delayed
  function renderEvents() {
    const list = document.getElementById('eventList');
    const now = new Date();

    list.innerHTML = currentEvents.map(e => {
      const start = new Date(e.start);
      const end = new Date(e.end);
      let status = '';

      if (e.aborted) status = '<span class="badge bg-secondary">Aborted</span>';
      else if (e.delayed) status = '<span class="badge bg-warning">Delayed</span>';
      else if (now < start) status = '<span class="badge bg-info">Upcoming</span>';
      else if (now > end) status = '<span class="badge bg-danger">Expired</span>';
      else status = '<span class="badge bg-success">Current</span>';

      return `
        <div class="list-group-item d-flex justify-content-between align-items-center">
          <div>
            <strong>${e.title}</strong><br>
            <small>${e.start} → ${e.end}</small><br>
            <small>${e.desc}</small><br>
            ${status}
          </div>
          <div>
            <button class="btn btn-warning btn-sm me-2" onclick="editEvent('${e.key}')">Sửa</button>
            <button class="btn btn-danger btn-sm" onclick="deleteEvent('${e.key}')">Xóa</button>
          </div>
        </div>
      `;
    }).join('');
  }

  // Simple edit/delete functions (you can expand later)
  window.editProduct = (key) => alert("Edit product " + key + " - expand if needed");
  window.deleteProduct = (key) => { if(confirm('Xóa?')) remove(ref(db, 'products/'+key)); };
  window.editEvent = (key) => alert("Edit event " + key + " - expand if needed");
  window.deleteEvent = (key) => { if(confirm('Xóa?')) remove(ref(db, 'events/'+key)); };

  // Submit handlers (basic)
  document.getElementById('productForm').addEventListener('submit', async e => {
    e.preventDefault();
    const data = {
      name: document.getElementById('productName').value,
      price: document.getElementById('productPrice').value,
      category: document.getElementById('productCategory').value,
      image: document.getElementById('productImage').value,
      outOfStock: document.getElementById('productOutOfStock').checked
    };
    await push(ref(db, 'products'), data);
    e.target.reset();
  });

  document.getElementById('eventForm').addEventListener('submit', async e => {
    e.preventDefault();
    const data = {
      title: document.getElementById('eventTitle').value,
      start: document.getElementById('eventStart').value,
      end: document.getElementById('eventEnd').value,
      desc: document.getElementById('eventDesc').value,
      image: document.getElementById('eventImage').value,
      aborted: document.getElementById('eventAborted').checked,
      delayed: document.getElementById('eventDelayed').checked
    };
    await push(ref(db, 'events'), data);
    e.target.reset();
  });
</script>
</body>
</html>
