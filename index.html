<!DOCTYPE html>
<html lang="vi" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InkSpire Bookstore</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --green-light: #00c4b4;
      --green-dark:  #3de0c2;
      --green:       var(--green-light);
    }

    [data-bs-theme="dark"] {
      --green:       var(--green-dark);
      --bs-body-bg:  #0a0f14;
      --bs-body-color: #e0e6ed;
    }

    body {
      transition: background-color 0.35s, color 0.35s;
    }

    .navbar {
      background-color: var(--green) !important;
    }

    .hero {
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1507842217343-583bb7278b66?w=1600') center/cover no-repeat;
      height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .slider-container {
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .slider-track {
      display: flex;
      transition: transform 0.5s ease;
    }

    .item {
      flex: 0 0 25%;
      padding: 0 10px;
      box-sizing: border-box;
    }

    .item img {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .item .price {
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
      color: var(--green);
    }

    footer {
      background-color: var(--green);
      color: white;
    }

    /* Lang switch style */
    .lang-group {
      cursor: pointer;
      user-select: none;
    }

    .flag {
      font-size: 1.55rem;
      transition: opacity 0.3s;
    }

    .flag.inactive {
      opacity: 0.48;
    }

    .switch {
      position: relative;
      width: 56px;
      height: 28px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .switch .slider {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.38);
      border-radius: 34px;
      border: 2px solid white;
      transition: background 0.38s;
      cursor: pointer;
    }

    .switch .slider:before {
      content: "";
      position: absolute;
      height: 20px;
      width: 20px;
      left: 4px;
      bottom: 4px;
      background: white;
      border-radius: 50%;
      transition: transform 0.38s;
    }

    .switch input:checked + .slider {
      background: white;
    }

    .switch input:checked + .slider:before {
      transform: translateX(28px);
      background: var(--green);
    }
  </style>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA9XvWCZOyaSuT42HBMUgQQ7KTuQYPWLbE",
      authDomain: "inkspire-vn-security.firebaseapp.com",
      databaseURL: "https://inkspire-vn-security-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "inkspire-vn-security",
      storageBucket: "inkspire-vn-security.firebasestorage.app",
      messagingSenderId: "774834040534",
      appId: "1:774834040534:web:c7b5e64826176a44b4e377",
      measurementId: "G-MJSRBE9TY6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.db = db;
    window.ref = ref;
    window.onValue = onValue;
  </script>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg sticky-top shadow navbar-dark">
  <div class="container">
    <a class="navbar-brand fw-bold fs-4" href="/">InkSpire</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link active" href="/" data-lang-key="home">Trang chủ</a></li>
        <li class="nav-item"><a class="nav-link" href="/products" data-lang-key="products">Sản phẩm</a></li>
        <li class="nav-item"><a class="nav-link" href="/events" data-lang-key="events">Sự kiện</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact" data-lang-key="contact">Liên hệ</a></li>
      </ul>

      <div class="d-flex align-items-center gap-4">
        <div class="lang-group" id="langGroup" role="button" tabindex="0">
          <span class="flag vi-flag" data-lang="vi">🇻🇳</span>
          <div class="switch">
            <input type="checkbox" id="langSwitch">
            <span class="slider"></span>
          </div>
          <span class="flag en-flag" data-lang="en">🇺🇸</span>
        </div>
        <button class="theme-btn btn btn-sm btn-outline-light" id="themeBtn">🌙</button>
      </div>
    </div>
  </div>
</nav>

<!-- Hero -->
<section class="hero text-center text-white">
  <div class="container">
    <h1 class="display-4 fw-bold mb-3" data-lang-key="welcome">Chào mừng đến InkSpire Bookstore</h1>
    <p class="lead mb-4" data-lang-key="tagline">Nơi tri thức bắt đầu từ một giọt mực</p>
    <a href="/products" class="btn btn-light btn-lg px-5" data-lang-key="shop-now">Mua sắm ngay</a>
  </div>
</section>

<!-- Products Slider -->
<section class="py-5 bg-light">
  <div class="container">
    <h2 class="text-center mb-5" data-lang-key="featured-products">Sản phẩm nổi bật</h2>
    <div class="slider-container">
      <div class="slider-track" id="productSlider"></div>
    </div>
  </div>
</section>

<!-- Upcoming Events -->
<section class="py-5">
  <div class="container">
    <h2 class="text-center mb-5" data-lang-key="upcoming-events">Sự kiện sắp tới</h2>
    <div id="eventList" class="row g-4"></div>
  </div>
</section>

<!-- Footer -->
<footer class="text-center py-4 text-white">
  <div class="container">
    <p class="mb-1">© 2026 InkSpire Bookstore • TP. Hồ Chí Minh</p>
    <small data-lang-key="footer">Tri thức bắt đầu từ một giọt mực</small>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
  const html = document.documentElement;
  const themeBtn = document.getElementById('themeBtn');

  function setTheme(mode) {
    html.setAttribute('data-bs-theme', mode);
    localStorage.setItem('theme', mode);
    themeBtn.textContent = mode === 'dark' ? '☀️' : '🌙';
  }

  setTheme(localStorage.getItem('theme') || 'light');
  themeBtn.onclick = () => setTheme(html.getAttribute('data-bs-theme') === 'light' ? 'dark' : 'light');

  const langGroup = document.getElementById('langGroup');
  const langSwitch = document.getElementById('langSwitch');

  const dict = {
    vi: {
      home: "Trang chủ",
      products: "Sản phẩm",
      events: "Sự kiện",
      contact: "Liên hệ",
      welcome: "Chào mừng đến InkSpire Bookstore",
      tagline: "Nơi tri thức bắt đầu từ một giọt mực",
      "shop-now": "Mua sắm ngay",
      "featured-products": "Sản phẩm nổi bật",
      "upcoming-events": "Sự kiện sắp tới",
      footer: "Tri thức bắt đầu từ một giọt mực"
    },
    en: {
      home: "Home",
      products: "Products",
      events: "Events",
      contact: "Contact",
      welcome: "Welcome to InkSpire Bookstore",
      tagline: "Where knowledge begins with a drop of ink",
      "shop-now": "Shop Now",
      "featured-products": "Featured Products",
      "upcoming-events": "Upcoming Events",
      footer: "Knowledge begins with a drop of ink"
    }
  };

  function setLang(lang) {
    html.lang = lang;
    localStorage.setItem('lang', lang);
    langSwitch.checked = (lang === 'en');

    document.querySelector('.vi-flag').classList.toggle('inactive', lang !== 'vi');
    document.querySelector('.en-flag').classList.toggle('inactive', lang !== 'en');

    document.querySelectorAll('[data-lang-key]').forEach(el => {
      const k = el.getAttribute('data-lang-key');
      if (dict[lang][k]) el.textContent = dict[lang][k];
    });
  }

  setLang(localStorage.getItem('lang') || 'vi');

  langGroup.addEventListener('click', () => {
    const cur = localStorage.getItem('lang') || 'vi';
    setLang(cur === 'vi' ? 'en' : 'vi');
  });

  langSwitch.addEventListener('change', () => {
    setLang(langSwitch.checked ? 'en' : 'vi');
  });

  // Firebase real-time data
  onValue(ref(db, 'products'), (snapshot) => {
    const data = snapshot.val() || {};
    const products = Object.values(data);
    const track = document.getElementById('productSlider');
    track.innerHTML = '';

    if (products.length === 0) {
      track.innerHTML = '<p class="text-center text-muted py-4">Chưa có sản phẩm trong danh mục này</p>';
      return;
    }

    products.forEach(item => {
      track.innerHTML += `
        <div class="item">
          <img src="${item.image || 'https://via.placeholder.com/240x320?text=No+Image'}" alt="${item.name}">
          <div class="price">${item.price}</div>
        </div>
      `;
    });

    // Duplicate for infinite loop
    track.innerHTML += track.innerHTML;
  });

  onValue(ref(db, 'events'), (snapshot) => {
    const data = snapshot.val() || {};
    const events = Object.values(data);
    const eventList = document.getElementById('eventList');
    const now = new Date();

    eventList.innerHTML = '';

    const activeEvents = events.filter(e => {
      const start = new Date(e.start);
      return now < start && !e.aborted && !e.delayed;
    });

    if (activeEvents.length === 0) {
      eventList.innerHTML = '<p class="text-center text-muted py-4">Chưa có sự kiện sắp tới</p>';
      return;
    }

    activeEvents.forEach(e => {
      const card = `
        <div class="col-md-4">
          <div class="card">
            <img src="${e.image || 'https://via.placeholder.com/400x200?text=No+Image'}" class="card-img-top" alt="${e.title}">
            <div class="card-body">
              <h5 class="card-title">${e.title}</h5>
              <p>${e.start} - ${e.end}</p>
              <p>${e.desc.substring(0, 100)}...</p>
            </div>
          </div>
        </div>
      `;
      eventList.innerHTML += card;
    });
  });
</script>
</body>
</html>
