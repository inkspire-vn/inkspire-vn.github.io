<!DOCTYPE html>
<html lang="vi" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết sự kiện - InkSpire Bookstore</title>
  <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/254457838?s=64">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .page-hero { background:linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&q=80') center/cover; color:white; height:30vh; min-height:200px; display:flex; align-items:center; justify-content:center; text-shadow:1px 1px 4px rgba(0,0,0,0.7); }
    .detail-card { background:rgba(255,255,255,0.95); border-radius:16px; padding:2.5rem; box-shadow:0 10px 35px rgba(0,0,0,0.18); border:2px solid var(--green); }
    [data-bs-theme="dark"] .detail-card { background:#1e293b; border-color:var(--green); }
    .detail-img { width:100%; max-height:480px; object-fit:cover; border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,0.18); }
    .detail-desc { white-space:pre-wrap; line-height:1.7; font-size:1.05rem; }
    .detail-time { font-weight:600; color:var(--bs-primary); font-size:1.1rem; }
    .status-badge { font-size:1rem; padding:8px 18px; border-radius:999px; font-weight:600; display:inline-block; }
    .status-upcoming { background:#0dcaf0; color:white; }
    .status-current  { background:#198754; color:white; }
    .status-expired  { background:#dc3545; color:white; }
    .status-aborted  { background:#6c757d; color:white; }
    .status-delayed  { background:#fd7e14; color:white; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg sticky-top shadow">
  <div class="container">
    <a class="navbar-brand fw-bold fs-4" href="https://inkspire-vn.github.io">InkSpire</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="https://inkspire-vn.github.io">Trang chủ</a></li>
        <li class="nav-item"><a class="nav-link" href="/products">Sản phẩm</a></li>
        <li class="nav-item"><a class="nav-link active" href="/events">Sự kiện</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact">Liên hệ</a></li>
      </ul>
      <div class="d-flex align-items-center">
        <button class="theme-btn" id="themeBtn">🌙</button>
      </div>
    </div>
  </div>
</nav>

<section class="page-hero text-center">
  <div class="container h-100 d-flex align-items-center justify-content-center">
    <h1 class="display-5 fw-bold text-white">Chi tiết sự kiện</h1>
  </div>
</section>

<main class="container py-5">
  <div id="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status" style="width:3rem;height:3rem;"></div>
    <p class="mt-4 fs-5">Đang tải...</p>
  </div>

  <div id="notfound" class="text-center py-5 d-none">
    <i class="fas fa-exclamation-circle fa-5x text-muted mb-4"></i>
    <h4 class="mb-3">Không tìm thấy sự kiện</h4>
    <a href="/events" class="btn btn-outline-primary btn-lg px-5">Quay về Sự kiện</a>
  </div>

  <div id="detail-content" class="d-none">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="detail-card">
          <div class="row g-4 align-items-start">
            <div class="col-md-6" id="d-image-col">
              <img id="d-image" class="detail-img" src="" alt="">
            </div>
            <div class="col-md-6" id="d-text-col">
              <h2 id="d-title" class="fw-bold mb-3"></h2>
              <p class="detail-time mb-1"><i class="fas fa-clock me-2"></i><span id="d-start"></span> → <span id="d-end"></span></p>
              <div class="mb-4 mt-3" id="d-status"></div>
              <h5 class="mb-2">Mô tả</h5>
              <p id="d-desc" class="detail-desc text-muted"></p>
              <a href="/contact" class="btn btn-primary btn-lg mt-3">Liên hệ để biết thêm</a>
            </div>
          </div>
        </div>
        <div class="text-center mt-4">
          <a href="/events" class="btn btn-outline-secondary">← Quay về Sự kiện</a>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="text-center py-4" style="background:var(--bs-primary);color:white;">
  <div class="container">
    <p class="mb-1">© 2026 InkSpire Bookstore • TP. Hồ Chí Minh</p>
    <small>Tri thức bắt đầu từ một giọt mực</small>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
  import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
  const _fc={apiKey:"AIzaSyA9XvWCZOyaSuT42HBMUgQQ7KTuQYPWLbE",authDomain:"inkspire-vn-security.firebaseapp.com",databaseURL:"https://inkspire-vn-security-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"inkspire-vn-security",storageBucket:"inkspire-vn-security.firebasestorage.app",messagingSenderId:"774834040534",appId:"1:774834040534:web:c7b5e64826176a44b4e377",measurementId:"G-MJSRBE9TY6"};
  const app = getApps().length ? getApps()[0] : initializeApp(_fc);
  const db = getDatabase(app);

  const html = document.documentElement;
  const themeBtn = document.getElementById('themeBtn');
  function setTheme(mode) { html.setAttribute('data-bs-theme',mode); localStorage.setItem('theme',mode); themeBtn.textContent = mode==='dark'?'☀️':'🌙'; }
  setTheme(localStorage.getItem('theme')||'light');
  themeBtn.onclick = () => setTheme(html.getAttribute('data-bs-theme')==='light'?'dark':'light');

  function parseDate(str) {
    if (!str) return null;
    const m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?:\s*(AM|PM))?/i);
    if (m) {
      let [,d,mo,y,h,mi,ap]=m; h=parseInt(h);
      if(ap){ if(ap.toUpperCase()==='PM'&&h!==12)h+=12; if(ap.toUpperCase()==='AM'&&h===12)h=0; }
      return new Date(+y,+mo-1,+d,h,parseInt(mi));
    }
    return new Date(str);
  }

  const params = new URLSearchParams(window.location.search);
  const key = params.get('key');

  const loading = document.getElementById('loading');
  const notfound = document.getElementById('notfound');
  const content = document.getElementById('detail-content');

  if (!key) {
    loading.classList.add('d-none');
    notfound.classList.remove('d-none');
  } else {
    onValue(ref(db, `events/${key}`), (snapshot) => {
      const e = snapshot.val();
      loading.classList.add('d-none');
      if (!e) { notfound.classList.remove('d-none'); content.classList.add('d-none'); return; }
      notfound.classList.add('d-none');
      content.classList.remove('d-none');

      document.title = `${e.title} - InkSpire Bookstore`;
      document.getElementById('d-title').textContent = e.title || 'Không có tiêu đề';
      document.getElementById('d-start').textContent = e.start || 'N/A';
      document.getElementById('d-end').textContent = e.end || 'N/A';
      document.getElementById('d-desc').textContent = e.desc && e.desc.trim() ? e.desc : 'Chưa có mô tả cho sự kiện này.';

      if (e.image) {
        document.getElementById('d-image').src = e.image;
        document.getElementById('d-image').alt = e.title;
      } else {
        document.getElementById('d-image-col').classList.add('d-none');
        document.getElementById('d-text-col').classList.remove('col-md-6');
        document.getElementById('d-text-col').classList.add('col-12');
      }

      const start = parseDate(e.start);
      const end = parseDate(e.end);
      const now = new Date();
      let sc, st;
      if (e.aborted)             { sc='status-aborted';  st='Bị hủy'; }
      else if (e.delayed)        { sc='status-delayed';  st='Bị hoãn'; }
      else if (start && now < start) { sc='status-upcoming'; st='Sắp diễn ra'; }
      else if (end && now > end)     { sc='status-expired';  st='Đã kết thúc'; }
      else                        { sc='status-current';  st='Đang diễn ra'; }
      document.getElementById('d-status').innerHTML = `<span class="status-badge ${sc}">${st}</span>`;
    });
  }
</script>
</body>
</html>
