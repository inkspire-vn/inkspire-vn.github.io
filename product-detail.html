<!DOCTYPE html>
<html lang="vi" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết sản phẩm - InkSpire Bookstore</title>
  <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/254457838?s=64">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .product-detail-wrap {
      min-height: calc(100vh - 130px);
      padding: 3rem 0 4rem;
    }
    .product-img {
      width: 100%;
      max-height: 520px;
      object-fit: cover;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }
    .product-info-card {
      background: var(--bs-body-bg);
      border-radius: 16px;
      padding: 2.5rem;
      border: 2px solid var(--bs-primary);
      box-shadow: 0 6px 24px rgba(0,0,0,0.1);
      height: 100%;
    }
    .product-category-badge {
      display: inline-block;
      background: rgba(0,196,180,0.12);
      color: var(--bs-primary);
      font-weight: 600;
      font-size: 0.9rem;
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 1rem;
    }
    .product-name { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
    .product-desc { white-space: pre-wrap; line-height: 1.75; font-size: 1.05rem; color: var(--bs-body-color); opacity: 0.85; }
    .oos-badge { display:inline-block; background:#dc3545; color:white; padding:6px 18px; border-radius:999px; font-weight:600; margin-bottom:1rem; }
    .divider { border-top: 1px solid var(--bs-border-color); margin: 1.5rem 0; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top shadow">
  <div class="container">
    <a class="navbar-brand fw-bold fs-4" href="https://inkspire-vn.github.io">InkSpire</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="https://inkspire-vn.github.io">Trang chủ</a></li>
        <li class="nav-item"><a class="nav-link active" href="/products">Sản phẩm</a></li>
        <li class="nav-item"><a class="nav-link" href="/events">Sự kiện</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact">Liên hệ</a></li>
      </ul>
      <div class="d-flex align-items-center">
        <button class="theme-btn" id="themeBtn">🌙</button>
      </div>
    </div>
  </div>
</nav>

<div class="product-detail-wrap">
  <div class="container">

    <!-- Loading -->
    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status" style="width:3rem;height:3rem;"></div>
      <p class="mt-4 fs-5">Đang tải sản phẩm...</p>
    </div>

    <!-- Not found -->
    <div id="notfound" class="text-center py-5 d-none">
      <i class="fas fa-exclamation-circle fa-5x text-muted mb-4"></i>
      <h4 class="mb-3">Không tìm thấy sản phẩm</h4>
      <a href="/products" class="btn btn-outline-primary btn-lg px-5">← Quay về Sản phẩm</a>
    </div>

    <!-- Detail -->
    <div id="detail-content" class="d-none">
      <div class="mb-4">
        <a href="/products" class="text-decoration-none text-muted small">
          <i class="fas fa-arrow-left me-1"></i> Tất cả sản phẩm
        </a>
      </div>
      <div class="row g-4 align-items-start">
        <!-- Image -->
        <div class="col-md-6" id="d-image-col">
          <img id="d-image" class="product-img" src="" alt="">
        </div>
        <!-- Info -->
        <div class="col-md-6">
          <div class="product-info-card">
            <div id="d-oos" class="d-none"><span class="oos-badge">Hết hàng</span></div>
            <span id="d-category" class="product-category-badge"></span>
            <h1 id="d-name" class="product-name"></h1>
            <div class="divider"></div>
            <p class="fw-semibold mb-1">Mô tả</p>
            <p id="d-desc" class="product-desc"></p>
            <div class="divider"></div>
            <a href="/contact" class="btn btn-primary btn-lg w-100 mt-2">
              <i class="fas fa-phone-alt me-2"></i>Liên hệ đặt mua
            </a>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<footer class="text-center py-4" style="background:var(--bs-primary);color:white;">
  <div class="container">
    <p class="mb-1">© 2026 InkSpire Bookstore • TP. Hồ Chí Minh</p>
    <small>Tri thức bắt đầu từ một giọt mực</small>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
  import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
  const _fc={apiKey:"AIzaSyA9XvWCZOyaSuT42HBMUgQQ7KTuQYPWLbE",authDomain:"inkspire-vn-security.firebaseapp.com",databaseURL:"https://inkspire-vn-security-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"inkspire-vn-security",storageBucket:"inkspire-vn-security.firebasestorage.app",messagingSenderId:"774834040534",appId:"1:774834040534:web:c7b5e64826176a44b4e377",measurementId:"G-MJSRBE9TY6"};
  const app = getApps().length ? getApps()[0] : initializeApp(_fc);
  const db = getDatabase(app);

  const html = document.documentElement;
  const themeBtn = document.getElementById('themeBtn');
  function setTheme(mode) { html.setAttribute('data-bs-theme',mode); localStorage.setItem('theme',mode); themeBtn.textContent = mode==='dark'?'☀️':'🌙'; }
  setTheme(localStorage.getItem('theme')||'light');
  themeBtn.onclick = () => setTheme(html.getAttribute('data-bs-theme')==='light'?'dark':'light');

  const params = new URLSearchParams(window.location.search);
  const key = params.get('key');
  const loading  = document.getElementById('loading');
  const notfound = document.getElementById('notfound');
  const content  = document.getElementById('detail-content');

  if (!key) {
    loading.classList.add('d-none');
    notfound.classList.remove('d-none');
  } else {
    onValue(ref(db, `products/${key}`), (snapshot) => {
      const p = snapshot.val();
      loading.classList.add('d-none');
      if (!p) { notfound.classList.remove('d-none'); return; }
      content.classList.remove('d-none');

      document.title = `${p.name} - InkSpire Bookstore`;
      const img = document.getElementById('d-image');
      if (p.image) {
        img.src = p.image;
        img.alt = p.name;
      } else {
        document.getElementById('d-image-col').classList.add('d-none');
        document.querySelector('.col-md-6:last-child').classList.replace('col-md-6','col-12');
      }
      document.getElementById('d-name').textContent = p.name;
      document.getElementById('d-category').textContent = p.category || 'Sản phẩm';
      document.getElementById('d-desc').innerHTML = p.desc?.trim() ? p.desc : 'Chưa có mô tả cho sản phẩm này.';
      document.getElementById('d-oos').classList.toggle('d-none', !p.outOfStock);
    });
  }
</script>
</body>
</html>
