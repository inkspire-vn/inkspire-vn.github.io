<!DOCTYPE html>
<html lang="vi" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sự kiện - InkSpire Bookstore</title>

  <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/254457838?s=64">

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA9XvWCZOyaSuT42HBMUgQQ7KTuQYPWLbE",
      authDomain: "inkspire-vn-security.firebaseapp.com",
      databaseURL: "https://inkspire-vn-security-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "inkspire-vn-security",
      storageBucket: "inkspire-vn-security.firebasestorage.app",
      messagingSenderId: "774834040534",
      appId: "1:774834040534:web:c7b5e64826176a44b4e377",
      measurementId: "G-MJSRBE9TY6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.db = db;
    window.ref = ref;
    window.onValue = onValue;
  </script>

  <style>
    .event-card {
      transition: transform 0.25s, box-shadow 0.25s;
      border: none;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }
    .event-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.15);
    }
    .event-card .card-img-top {
      height: 220px;
      object-fit: cover;
    }
    .event-time {
      font-weight: 600;
      color: var(--bs-primary);
    }
    .event-desc {
      max-height: 4.5em; /* ~4 lines */
      overflow: hidden;
      transition: max-height 0.4s ease;
      line-height: 1.6;
    }
    .event-desc.expanded {
      max-height: 1000px; /* large enough for long text */
    }
    .toggle-btn {
      background: none;
      border: none;
      color: var(--bs-primary);
      font-weight: 600;
      cursor: pointer;
      padding: 0 4px;
      margin-left: 6px;
    }
    .toggle-btn:hover {
      text-decoration: underline;
    }
    .status-badge {
      font-size: 0.95rem;
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 600;
    }
    .status-upcoming { background: #0dcaf0; color: white; }
    .status-current  { background: #198754; color: white; }
    .status-expired  { background: #dc3545; color: white; }
    .status-aborted  { background: #6c757d; color: white; }
    .status-delayed  { background: #fd7e14; color: white; }
    .page-hero {
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
                  url('https://images.unsplash.com/photo-1507842217343-583bb7278b66?w=1600') center/cover;
      color: white;
      height: 35vh;
      min-height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.7);
    }
    footer {
      background: var(--bs-primary);
      color: white;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg sticky-top shadow">
  <div class="container">
    <a class="navbar-brand fw-bold fs-4" href="https://inkspire-vn.github.io">InkSpire</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="https://inkspire-vn.github.io" data-lang-key="home">Trang chủ</a></li>
        <li class="nav-item"><a class="nav-link" href="/products" data-lang-key="products">Sản phẩm</a></li>
        <li class="nav-item"><a class="nav-link active" href="/events" data-lang-key="events">Sự kiện</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact" data-lang-key="contact">Liên hệ</a></li>
      </ul>

      <div class="d-flex align-items-center gap-4">
        <div class="lang-group" id="langGroup" role="button" tabindex="0">
          <span class="flag vi-flag" data-lang="vi">🇻🇳</span>
          <div class="switch">
            <input type="checkbox" id="langSwitch">
            <span class="slider"></span>

        <button class="theme-btn" id="themeBtn">🌙</button>

    </div>

</nav>
<!-- Site Status Banner -->
<div id="site-status-banner" class="d-none" style="position:sticky;top:56px;z-index:1020;"></div>
<script type="module">
  import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
  const _fbc={apiKey:"AIzaSyA9XvWCZOyaSuT42HBMUgQQ7KTuQYPWLbE",authDomain:"inkspire-vn-security.firebaseapp.com",databaseURL:"https://inkspire-vn-security-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"inkspire-vn-security",storageBucket:"inkspire-vn-security.firebasestorage.app",messagingSenderId:"774834040534",appId:"1:774834040534:web:c7b5e64826176a44b4e377"};
  const _app=getApps().length?getApps()[0]:initializeApp(_fbc);
  const _db=getDatabase(_app);
  const _SM={
    message:{color:"#e8f5e9",border:"#00c4b4",icon:"📢",label:"Message"},
    construction:{color:"#fff3cd",border:"#ffc107",icon:"🚧",label:"This page is under construction"},
    update:{color:"#cff4fc",border:"#0dcaf0",icon:"🔄",label:"This page is currently being updated"},
    bugfix:{color:"#f8d7da",border:"#dc3545",icon:"🐛",label:"A bug fix is in progress on this page"},
    maintenance:{color:"#fff3cd",border:"#fd7e14",icon:"🔧",label:"This page is under maintenance"},
    coming_soon:{color:"#e2e3e5",border:"#6c757d",icon:"⏳",label:"Coming soon — stay tuned!"},
    limited:{color:"#fff3cd",border:"#ffc107",icon:"⚠️",label:"Limited availability on this page"},
  };
  onValue(ref(_db,"siteStatus/events"),(snap)=>{
    const banner=document.getElementById("site-status-banner");
    const data=snap.val();
    if(!data||!data.type||data.type==="none"){banner.classList.add("d-none");banner.innerHTML="";return;}
    const m=_SM[data.type]||{color:"#e2e3e5",border:"#6c757d",icon:"ℹ️",label:data.type};
    const msg=data.message||m.label;
    banner.innerHTML=`<div class="site-banner-inner" style="border-bottom:3px solid ${m.border};padding:10px 24px;text-align:center;font-weight:600;font-size:0.95rem;" data-color="${m.color}" data-border="${m.border}">${m.icon}&nbsp;${msg}</div>`;
    banner.classList.remove("d-none");
  });
</script>

<!-- Hero -->
<section class="page-hero text-center">
  <div class="container h-100 d-flex align-items-center justify-content-center">
    <h1 class="display-4 fw-bold text-white" data-lang-key="events">Sự kiện</h1>
  </div>
</section>

<main class="container py-5">

  <div id="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
    <p class="mt-4 fs-5" data-lang-key="loading">Đang tải sự kiện...</p>
  </div>

  <div id="event-grid" class="row g-4 d-none"></div>

  <div id="no-events" class="text-center py-5 d-none">
    <i class="fas fa-calendar-times fa-5x text-muted mb-4"></i>
    <h4 class="mb-3">Chưa có sự kiện nào</h4>
    <p class="text-muted fs-5 mb-4">
      Hiện tại chưa có sự kiện nào được lên lịch. Vui lòng theo dõi lại sau!
    </p>
    <a href="/contact" class="btn btn-outline-primary btn-lg px-5">Liên hệ để biết thêm</a>
  </div>

</main>

<footer class="text-center py-4 text-white">
  <div class="container">
    <p class="mb-1">© 2026 InkSpire Bookstore • TP. Hồ Chí Minh</p>
    <small data-lang-key="footer">Tri thức bắt đầu từ một giọt mực</small>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
  const html = document.documentElement;
  const themeBtn = document.getElementById('themeBtn');

  function setTheme(mode) {
    html.setAttribute('data-bs-theme', mode);
    localStorage.setItem('theme', mode);
    themeBtn.textContent = mode === 'dark' ? '☀️' : '🌙';
  }
  setTheme(localStorage.getItem('theme') || 'light');
  themeBtn.onclick = () => setTheme(html.getAttribute('data-bs-theme') === 'light' ? 'dark' : 'light');

  const langGroup = document.getElementById('langGroup');
  const langSwitch = document.getElementById('langSwitch');

  const dict = {
    vi: {
      home: "Trang chủ", products: "Sản phẩm", events: "Sự kiện", contact: "Liên hệ",
      loading: "Đang tải sự kiện...", "no-events": "Chưa có sự kiện nào",
      footer: "Tri thức bắt đầu từ một giọt mực", "see-more": "Xem thêm", "show-less": "Thu gọn",
      translating: "Đang dịch..."
    },
    en: {
      home: "Home", products: "Products", events: "Events", contact: "Contact",
      loading: "Loading events...", "no-events": "No events scheduled yet",
      footer: "Knowledge begins with a drop of ink", "see-more": "See more", "show-less": "Show less",
      translating: "Translating..."
    }
  };

  // ── Translation cache & engine ──────────────────────────────────
  const CACHE_KEY = 'inkspire_trans_cache_v1';
  let transCache = {};
  try { transCache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}'); } catch {}

  async function translate(text, targetLang) {
    if (!text || !text.trim()) return text;
    if (targetLang === 'vi') return text; // source is always VI
    const cacheKey = `${targetLang}::${text}`;
    if (transCache[cacheKey]) return transCache[cacheKey];
    try {
      const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=vi|en`);
      const json = await res.json();
      const translated = json?.responseData?.translatedText || text;
      transCache[cacheKey] = translated;
      localStorage.setItem(CACHE_KEY, JSON.stringify(transCache));
      return translated;
    } catch { return text; }
  }

  async function translateBatch(texts, targetLang) {
    return Promise.all(texts.map(t => translate(t, targetLang)));
  }

  // ── Date parser: handles "DD/MM/YYYY HH:MM" and ISO ────────────
  function parseEventDate(str) {
    if (!str) return null;
    // Try DD/MM/YYYY HH:MM or DD/MM/YYYY HH:MM AM/PM
    const m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?:\s*(AM|PM))?/i);
    if (m) {
      let [, day, month, year, hour, min, ampm] = m;
      hour = parseInt(hour); min = parseInt(min);
      if (ampm) {
        if (ampm.toUpperCase() === 'PM' && hour !== 12) hour += 12;
        if (ampm.toUpperCase() === 'AM' && hour === 12) hour = 0;
      }
      return new Date(+year, +month - 1, +day, hour, min);
    }
    // Fallback to native (ISO etc.)
    return new Date(str);
  }

  // ── Render ──────────────────────────────────────────────────────
  let currentEvents = [];
  let currentlyExpandedKey = null;
  let currentLang = localStorage.getItem('lang') || 'vi';

  async function renderEvents(lang) {
    const grid = document.getElementById('event-grid');
    if (!grid || currentEvents.length === 0) return;

    // Show translating indicator
    if (lang === 'en') {
      grid.querySelectorAll('.card-title, .card-text, .event-time-label').forEach(el => {
        if (!el.dataset.orig) el.dataset.orig = el.textContent;
        el.style.opacity = '0.5';
      });
    }

    const now = new Date();
    grid.innerHTML = '';

    for (const event of currentEvents) {
      const start = parseEventDate(event.start);
      const end   = parseEventDate(event.end);

      let statusClass, statusTextVI, statusTextEN;
      if (event.aborted)       { statusClass = 'status-aborted';  statusTextVI = 'Bị hủy';       statusTextEN = 'Aborted'; }
      else if (event.delayed)  { statusClass = 'status-delayed';  statusTextVI = 'Bị hoãn';       statusTextEN = 'Delayed'; }
      else if (start && now < start) { statusClass = 'status-upcoming'; statusTextVI = 'Sắp diễn ra';  statusTextEN = 'Upcoming'; }
      else if (end   && now > end)   { statusClass = 'status-expired';  statusTextVI = 'Đã kết thúc';  statusTextEN = 'Expired'; }
      else                     { statusClass = 'status-current';  statusTextVI = 'Đang diễn ra'; statusTextEN = 'Ongoing'; }

      const statusText = lang === 'en' ? statusTextEN : statusTextVI;

      // Translate title + desc if needed
      let title = event.title || '';
      let fullDesc = event.desc || '';
      if (lang === 'en') {
        [title, fullDesc] = await translateBatch([title, fullDesc], 'en');
      }

      const hasMore = fullDesc.length > 150;
      const shortDesc = hasMore ? fullDesc.substring(0, 150) + '...' : fullDesc;
      const seeMoreText = dict[lang]['see-more'];

      grid.innerHTML += `
        <div class="col-12 col-md-6 col-lg-4">
          <div class="card h-100 event-card position-relative">
            ${event.image ? `<img src="${event.image}" class="card-img-top" alt="${title}">` : ''}
            <div class="card-body">
              <h5 class="card-title fw-bold">${title || (lang === 'en' ? 'No title' : 'Không có tiêu đề')}</h5>
              <p class="event-time mb-2">
                <i class="fas fa-clock me-2"></i>
                ${event.start || 'N/A'} → ${event.end || 'N/A'}
              </p>
              <p class="card-text event-desc mb-1" id="desc-${event.key}">${shortDesc}</p>
              ${hasMore ? `<button class="toggle-btn" data-key="${event.key}" data-full="${encodeURIComponent(fullDesc)}" data-short="${encodeURIComponent(shortDesc)}">${seeMoreText}</button>` : ''}
              <br>
              <span class="status-badge ${statusClass} mt-2 d-inline-block">${statusText}</span>
            </div>
          </div>
        </div>`;
    }
  }

  // ── Language ────────────────────────────────────────────────────
  function applyUILang(lang) {
    html.lang = lang;
    localStorage.setItem('lang', lang);
    currentLang = lang;
    langSwitch.checked = (lang === 'en');
    document.querySelector('.vi-flag').classList.toggle('inactive', lang !== 'vi');
    document.querySelector('.en-flag').classList.toggle('inactive', lang !== 'en');
    document.querySelectorAll('[data-lang-key]').forEach(el => {
      const k = el.getAttribute('data-lang-key');
      if (dict[lang][k]) el.textContent = dict[lang][k];
    });
  }

  async function setLang(lang) {
    applyUILang(lang);
    await renderEvents(lang);
  }

  langGroup.addEventListener('click', () => setLang(currentLang === 'vi' ? 'en' : 'vi'));
  langSwitch.addEventListener('change', () => setLang(langSwitch.checked ? 'en' : 'vi'));

  // ── Firebase ────────────────────────────────────────────────────
  onValue(ref(db, 'events'), async (snapshot) => {
    const loading = document.getElementById('loading');
    const grid = document.getElementById('event-grid');
    const noEvents = document.getElementById('no-events');

    if (loading) loading.classList.add('d-none');

    const data = snapshot.val() || {};
    currentEvents = Object.values(data);

    if (currentEvents.length === 0) {
      if (noEvents) noEvents.classList.remove('d-none');
      if (grid) { grid.classList.add('d-none'); grid.innerHTML = ''; }
      return;
    }

    if (noEvents) noEvents.classList.add('d-none');
    if (grid) grid.classList.remove('d-none');

    await renderEvents(currentLang);
    applyUILang(currentLang);
  });

  // ── Toggle (see more/less) ──────────────────────────────────────
  document.getElementById('event-grid').addEventListener('click', (e) => {
    const btn = e.target.closest('.toggle-btn');
    if (!btn) return;
    const key = btn.dataset.key;
    const descEl = document.getElementById(`desc-${key}`);
    if (!descEl) return;
    const seeMoreText = dict[currentLang]['see-more'];
    const showLessText = dict[currentLang]['show-less'];
    const isExpanded = btn.dataset.expanded === 'true';
    if (currentlyExpandedKey && currentlyExpandedKey !== key) {
      const prevBtn = document.querySelector(`.toggle-btn[data-key="${currentlyExpandedKey}"]`);
      const prevDesc = document.getElementById(`desc-${currentlyExpandedKey}`);
      if (prevBtn && prevDesc) {
        prevDesc.textContent = decodeURIComponent(prevBtn.dataset.short);
        prevDesc.classList.remove('expanded');
        prevBtn.textContent = seeMoreText;
        prevBtn.dataset.expanded = 'false';
      }
    }
    if (!isExpanded) {
      descEl.textContent = decodeURIComponent(btn.dataset.full);
      descEl.classList.add('expanded');
      btn.textContent = showLessText;
      btn.dataset.expanded = 'true';
      currentlyExpandedKey = key;
    } else {
      descEl.textContent = decodeURIComponent(btn.dataset.short);
      descEl.classList.remove('expanded');
      btn.textContent = seeMoreText;
      btn.dataset.expanded = 'false';
      currentlyExpandedKey = null;
    }
  });

  // Initial lang apply (UI only, Firebase will trigger render)
  applyUILang(currentLang);
</script>
</body>
</html>
