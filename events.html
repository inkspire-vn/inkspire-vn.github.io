<!DOCTYPE html>
<html lang="vi" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sự kiện - InkSpire Bookstore</title>
  <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/254457838?s=64">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .event-card { transition:transform 0.25s,box-shadow 0.25s; border:none; border-radius:12px; overflow:hidden; box-shadow:0 6px 20px rgba(0,0,0,0.1); cursor:pointer; }
    .event-card:hover { transform:translateY(-8px); box-shadow:0 16px 40px rgba(0,0,0,0.15); }
    .event-card .card-img-top { height:220px; object-fit:cover; }
    .event-time { font-weight:600; color:var(--bs-primary); }
    .event-desc { max-height:4.5em; overflow:hidden; line-height:1.6; }
    .status-badge { font-size:0.95rem; padding:6px 14px; border-radius:999px; font-weight:600; }
    .status-upcoming { background:#0dcaf0; color:white; }
    .status-current  { background:#198754; color:white; }
    .status-expired  { background:#dc3545; color:white; }
    .status-aborted  { background:#6c757d; color:white; }
    .status-delayed  { background:#fd7e14; color:white; }
    .page-hero { background:linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&q=80') center/cover; color:white; height:35vh; min-height:250px; display:flex; align-items:center; justify-content:center; text-shadow:1px 1px 4px rgba(0,0,0,0.7); }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg sticky-top shadow">
  <div class="container">
    <a class="navbar-brand fw-bold fs-4" href="https://inkspire-vn.github.io">InkSpire</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="https://inkspire-vn.github.io">Trang chủ</a></li>
        <li class="nav-item"><a class="nav-link" href="/products">Sản phẩm</a></li>
        <li class="nav-item"><a class="nav-link active" href="/events">Sự kiện</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact">Liên hệ</a></li>
      </ul>
      <div class="d-flex align-items-center">
        <button class="theme-btn" id="themeBtn">🌙</button>
      </div>
    </div>
  </div>
</nav>
<div id="site-status-banner" class="d-none" style="position:sticky;top:56px;z-index:1020;"></div>
<section class="page-hero text-center">
  <div class="container h-100 d-flex align-items-center justify-content-center">
    <h1 class="display-4 fw-bold text-white">Sự kiện</h1>
  </div>
</section>
<main class="container py-5">
  <div id="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status" style="width:3rem;height:3rem;"></div>
    <p class="mt-4 fs-5">Đang tải sự kiện...</p>
  </div>
  <div id="event-grid" class="row g-4 d-none"></div>
  <div id="no-events" class="text-center py-5 d-none">
    <i class="fas fa-calendar-times fa-5x text-muted mb-4"></i>
    <h4 class="mb-3">Chưa có sự kiện nào</h4>
    <p class="text-muted fs-5 mb-4">Hiện tại chưa có sự kiện nào được lên lịch. Vui lòng theo dõi lại sau!</p>
    <a href="/contact" class="btn btn-outline-primary btn-lg px-5">Liên hệ để biết thêm</a>
  </div>
</main>
<footer class="text-center py-4" style="background:var(--bs-primary);color:white;">
  <div class="container">
    <p class="mb-1">© 2026 InkSpire Bookstore • TP. Hồ Chí Minh</p>
    <small>Tri thức bắt đầu từ một giọt mực</small>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
  import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
  const _fc={apiKey:"AIzaSyA9XvWCZOyaSuT42HBMUgQQ7KTuQYPWLbE",authDomain:"inkspire-vn-security.firebaseapp.com",databaseURL:"https://inkspire-vn-security-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"inkspire-vn-security",storageBucket:"inkspire-vn-security.firebasestorage.app",messagingSenderId:"774834040534",appId:"1:774834040534:web:c7b5e64826176a44b4e377",measurementId:"G-MJSRBE9TY6"};
  const app = getApps().length ? getApps()[0] : initializeApp(_fc);
  const db = getDatabase(app);

  const html = document.documentElement;
  const themeBtn = document.getElementById('themeBtn');
  function setTheme(mode) { html.setAttribute('data-bs-theme',mode); localStorage.setItem('theme',mode); themeBtn.textContent=mode==='dark'?'☀️':'🌙'; }
  setTheme(localStorage.getItem('theme')||'light');
  themeBtn.onclick = () => setTheme(html.getAttribute('data-bs-theme')==='light'?'dark':'light');

  const _SM={message:{border:"#00c4b4",icon:"📢",label:"Thông báo"},construction:{border:"#ffc107",icon:"🚧",label:"Trang đang được xây dựng"},update:{border:"#0dcaf0",icon:"🔄",label:"Trang đang được cập nhật"},bugfix:{border:"#dc3545",icon:"🐛",label:"Đang sửa lỗi"},maintenance:{border:"#fd7e14",icon:"🔧",label:"Đang bảo trì"},coming_soon:{border:"#6c757d",icon:"⏳",label:"Sắp ra mắt"},limited:{border:"#ffc107",icon:"⚠️",label:"Tính năng có hạn"}};
  onValue(ref(db,"siteStatus/events"),(snap)=>{
    const banner=document.getElementById("site-status-banner");
    const data=snap.val();
    if(!data||!data.type||data.type==="none"){banner.classList.add("d-none");banner.innerHTML="";return;}
    const m=_SM[data.type]||{border:"#6c757d",icon:"ℹ️",label:data.type};
    banner.innerHTML=`<div class="site-banner-inner" style="border-bottom:3px solid ${m.border};padding:10px 24px;text-align:center;font-weight:600;font-size:0.95rem;">${m.icon}&nbsp;${data.message||m.label}</div>`;
    banner.classList.remove("d-none");
  });

  function parseDate(str) {
    if (!str) return null;
    const m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?:\s*(AM|PM))?/i);
    if (m) {
      let [,d,mo,y,h,mi,ap]=m; h=parseInt(h);
      if(ap){ if(ap.toUpperCase()==='PM'&&h!==12)h+=12; if(ap.toUpperCase()==='AM'&&h===12)h=0; }
      return new Date(+y,+mo-1,+d,h,parseInt(mi));
    }
    return new Date(str);
  }

  onValue(ref(db,'events'),(snapshot)=>{
    const loading=document.getElementById('loading');
    const grid=document.getElementById('event-grid');
    const noEvents=document.getElementById('no-events');
    if(loading)loading.classList.add('d-none');
    const events=Object.entries(snapshot.val()||{}).map(([key,val])=>({key,...val}));
    if(events.length===0){noEvents.classList.remove('d-none');grid.classList.add('d-none');grid.innerHTML='';return;}
    noEvents.classList.add('d-none');
    grid.classList.remove('d-none');
    grid.innerHTML='';
    const now=new Date();
    events.forEach(event=>{
      const start=parseDate(event.start);
      const end=parseDate(event.end);
      let sc,st;
      if(event.aborted)          {sc='status-aborted'; st='Bị hủy';}
      else if(event.delayed)     {sc='status-delayed'; st='Bị hoãn';}
      else if(start&&now<start)  {sc='status-upcoming';st='Sắp diễn ra';}
      else if(end&&now>end)      {sc='status-expired'; st='Đã kết thúc';}
      else                       {sc='status-current'; st='Đang diễn ra';}
      const fullDesc=event.desc||'';
      const shortDesc=fullDesc.length>150?fullDesc.substring(0,150)+'...':fullDesc;
      grid.innerHTML+=`
        <div class="col-12 col-md-6 col-lg-4">
          <a href="/event-detail?key=${event.key}" class="text-decoration-none" style="color:inherit;">
            <div class="card h-100 event-card position-relative">
              ${event.image?`<img src="${event.image}" class="card-img-top" alt="${event.title}">`:''}
              <div class="card-body">
                <h5 class="card-title fw-bold">${event.title||'Không có tiêu đề'}</h5>
                <p class="event-time mb-2"><i class="fas fa-clock me-2"></i>${event.start||'N/A'} → ${event.end||'N/A'}</p>
                <p class="card-text event-desc mb-1">${shortDesc}</p>
                <span class="status-badge ${sc} mt-2 d-inline-block">${st}</span>
              </div>
            </div>
          </a>
        </div>`;
    });
  });
</script>
</body>
</html>
